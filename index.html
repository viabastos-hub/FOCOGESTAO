// Gerenciador de Estado Local
let appState = loadState();

function loadState() {
  try {
    if (typeof window !== 'undefined' && window.localStorage) {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        return {
          ...defaultState,
          ...parsed,
          usuario: { ...defaultState.usuario, ...(parsed.usuario || {}) },
          calculoAtivo: { ...defaultState.calculoAtivo, ...(parsed.calculoAtivo || {}) }
        };
      }
    }
  } catch (e) {
    console.error('Erro ao carregar dados do LocalStorage:', e);
  }
  return JSON.parse(JSON.stringify(defaultState));
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  } catch (e) {
    console.error('Erro ao salvar dados:', e);
  }
}

// Utilitários de Formatação
function formatarMoeda(valor) {
  return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor || 0);
}

function formatarData(dataIso) {
  if (!dataIso) return '';
  const d = new Date(dataIso);
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

// Inicialização Robusta da Aplicação
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}

function initApp() {
  renderApp();
  registerServiceWorker();
}

function registerServiceWorker() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.log('ServiceWorker falhou:', err);
    });
  }
}

function switchTab(tabName) {
  appState.activeTab = tabName;
  saveState();
  renderApp();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

          </div>

          <div>
            <label class="block text-sm font-extrabold text-slate-200 mb-1.5">Seu WhatsApp de Atendimento (Opcional)</label>
            <input type="tel" id="login_telefone" placeholder="Ex: 11 99999-8888 (Opcional)"

          <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-4 px-4 rounded-2xl shadow-xl shadow-emerald-500/25 text-base uppercase tracking-wider transition active:scale-95">

          </button>
        </form>
      </div>
    </div>
  `;
}

function handleFazerLoginCPF(e) {
  e.preventDefault();
  const nome = document.getElementById('login_nome').value.trim();
  const documento = document.getElementById('login_documento').value.trim();
  const telefone = document.getElementById('login_telefone').value.trim();

  if (!nome) return;

  appState.usuario = {
    logado: true,
    nome: nome,
    documento: documento || 'Não informado',
    telefone: telefone || ''
  };

  saveState();
  renderApp();
}

function handleEditarPerfil() {
  const confirma = confirm(`Usuário Atual: ${appState.usuario.nome}\nCPF/CNPJ: ${appState.usuario.documento}\n\nDeseja alterar estes dados ou trocar de conta neste celular?`);
  if (confirma) {
    appState.usuario.logado = false;
    saveState();
    renderApp();
  }
}

function renderActiveTabContent() {
  switch (appState.activeTab) {
    case 'produtos':
      return renderProdutosTab();
    case 'calculadora':
      return renderCalculadoraTab();
    case 'orcamentos':
      return renderOrcamentosTab();
    case 'agenda':
      return renderAgendaTab();
    case 'dicas':
      return renderDicasTab();
    default:
      return renderCalculadoraTab();
  }
}

// ----------------------------------------------------
// TAB 1: MEUS PRODUTOS (COM FOTOS DE PRODUTOS & EDIÇÃO)
// ----------------------------------------------------
let mostrarFormProdutoState = false;
let produtoEmEdicaoId = null;
let tempFotoProdutoBase64 = '';

function toggleFormProduto() {
  mostrarFormProdutoState = !mostrarFormProdutoState;
  tempFotoProdutoBase64 = '';
  renderApp();
}

function handleAbrirEditarProduto(id) {
  produtoEmEdicaoId = id;
  renderApp();
}

function handleCancelarEditarProduto() {
  produtoEmEdicaoId = null;
  renderApp();
}

function handleSalvarEdicaoProduto(id) {
  const preco = parseFloat(document.getElementById(`edit_preco_${id}`).value);
  const volume = parseFloat(document.getElementById(`edit_volume_${id}`).value);
  if (isNaN(preco) || isNaN(volume) || volume <= 0) return;

  const prod = appState.produtos.find(p => p.id === id);
  if (prod) {
    prod.precoFrasco = preco;
    prod.volumeMl = volume;
    prod.custoPorMl = preco / volume;
  }
  produtoEmEdicaoId = null;
  saveState();
  renderApp();
}

function previewFotoProduto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    tempFotoProdutoBase64 = evt.target.result;
    const img = document.getElementById('prod_foto_preview_img');
    if (img) {
      img.src = tempFotoProdutoBase64;
      document.getElementById('prod_foto_preview_container').classList.remove('hidden');
    }
  };
  reader.readAsDataURL(file);
}

function handleSalvarProduto(e) {
  if (e) e.preventDefault();
  const nome = document.getElementById('p_nome').value.trim();
  const preco = parseFloat(document.getElementById('p_preco').value);
  const volume = parseFloat(document.getElementById('p_volume').value);

  if (!nome || isNaN(preco) || isNaN(volume) || volume <= 0) return;

  const custoPorMl = preco / volume;
  const novoProd = {
    id: 'p_' + Date.now(),
    eBase: false,
    nome,
    foto: tempFotoProdutoBase64 || 'https://cdn-icons-png.flaticon.com/512/2972/2972531.png',
    precoFrasco: preco,
    volumeMl: volume,
    custoPorMl
  };

  appState.produtos.push(novoProd);
  mostrarFormProdutoState = false;
  tempFotoProdutoBase64 = '';
  saveState();
  renderApp();
}

function handleExcluirProduto(id) {
  const prod = appState.produtos.find(p => p.id === id);
  if (prod && prod.eBase) {
    alert('Este produto é padrão do sistema e não pode ser removido.');
    return;
  }
  if (confirm('Deseja realmente remover este produto extra?')) {
    appState.produtos = appState.produtos.filter(p => p.id !== id);
    appState.calculoAtivo.produtosUsados = appState.calculoAtivo.produtosUsados.filter(pu => pu.produtoId !== id);
    saveState();
    renderApp();
  }
}

// ----------------------------------------------------
// TAB 2: CALCULADORA DE CUSTO & TERMÔMETRO DE LUCRO
// ----------------------------------------------------
function renderCalculadoraTab() {
  const calc = appState.calculoAtivo;

  // Cálculos dinâmicos
  let custoQuimicos = 0;
  calc.produtosUsados.forEach(pu => {
    const prod = appState.produtos.find(p => p.id === pu.produtoId);
    if (prod) {
      custoQuimicos += (pu.mlUsados || 0) * prod.custoPorMl;
    }
  });

  const custoOperacional = (calc.custoLocomocao || 0) +
                           (calc.custoMaquinario || 0) +
                           ((calc.horasTrabalho || 0) * (calc.valorHora || 0)) +
                           (calc.custoAlimentacao || 0) +
                           (calc.custosExtras || 0);

  const custoTotal = custoQuimicos + custoOperacional;

  let precoFinalCobrar = calc.precoCobradoPersonalizado !== null ? calc.precoCobradoPersonalizado : (custoTotal * (1 + (calc.margemSelecionada / 100)));
  let lucroLiquido = precoFinalCobrar - custoTotal;
  let margemPorcentagem = custoTotal > 0 ? (lucroLiquido / custoTotal) * 100 : 0;

  // Avaliação do Termômetro de Lucratividade

    badge: '🟢 LUCRO EXCELENTE',

    mensagem: 'Excelente margem! Seu preço valoriza seu trabalho e multiplica seu lucro diário.'

    diagnosticoLucro = {
      badge: '🔴 POUCO LUCRO (ATENÇÃO)',
      corClasse: 'text-rose-300 bg-rose-500/15 border-rose-500/40',
      icone: '⚠️',
      mensagem: 'Cuidado! Essa margem é baixa para higienização. Qualquer mancha difícil ou atraso pode te dar prejuízo. Sugerimos subir o valor.'
    };
  } else if (margemPorcentagem >= 45 && margemPorcentagem < 90) {
    diagnosticoLucro = {
      badge: '🟡 LUCRO MÉDIO (BOM)',
      corClasse: 'text-amber-300 bg-amber-500/15 border-amber-500/40',

      mensagem: 'Margem segura! Cobre bem os seus custos e garante um pagamento justo pelas suas horas.'

  return `

      <div class="bg-gradient-to-r from-emerald-950/60 to-slate-800/80 p-4 rounded-2xl border border-emerald-500/40">
        <h2 class="text-xl font-black text-emerald-400 flex items-center gap-2">
          🧮 Calcular Custo & Termômetro de Lucro
        </h2>
        <p class="text-sm text-slate-200 mt-1 leading-relaxed font-medium">
          Descubra na hora se o valor cobrado dá **Pouco, Médio ou Muito Lucro** para você!
        </p>
      </div>

      <!-- Passo 1: Nome/Tipo do Serviço -->
      <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg space-y-3">
        <label class="block text-sm font-black uppercase tracking-wider text-sky-400">1. O que você vai higienizar?</label>
        <div class="grid grid-cols-2 gap-2.5">
          ${['Sofá 2 Lugares', 'Sofá 3 Lugares', 'Colchão Casal', 'Colchão Solteiro', 'Banco Automotivo', 'Poltrona', 'Carrinho Bebê', 'Outro'].map(tipo => `
            <button onclick="handleSelectTipoServico('${tipo}')" class="py-3 px-3 rounded-xl border text-sm font-bold transition flex items-center justify-between ${calc.itemServico === tipo ? 'bg-sky-500/20 text-sky-300 border-sky-500 shadow-md' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'}">
              <span>${tipo}</span>
              ${calc.itemServico === tipo ? '✓' : ''}
            </button>
          `).join('')}
        </div>
      </div>

      <!-- Passo 2: Produtos Usados (ML) -->
      <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg space-y-3">
        <div class="flex items-center justify-between">
          <label class="block text-sm font-black uppercase tracking-wider text-sky-400">2. Químicos Usados neste Serviço</label>
          <span class="text-sm font-black text-emerald-400">Subtotal: ${formatarMoeda(custoQuimicos)}</span>
        </div>

        ${calc.produtosUsados.length === 0 ? `
          <p class="text-sm text-slate-400 italic">Nenhum produto adicionado neste serviço.</p>
        ` : calc.produtosUsados.map((pu, index) => {
          const prod = appState.produtos.find(p => p.id === pu.produtoId);
          if (!prod) return '';
          const custoEsteProd = pu.mlUsados * prod.custoPorMl;
          return `
            <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-700 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2.5 flex-1 min-w-0">
                <img src="${prod.foto || 'https://cdn-icons-png.flaticon.com/512/2972/2972531.png'}" class="w-8 h-8 object-contain shrink-0">
                <div class="min-w-0 flex-1">
                  <p class="text-sm font-extrabold text-white truncate">${prod.nome}</p>
                  <p class="text-xs text-slate-300 font-semibold">${formatarMoeda(prod.custoPorMl)}/ml × ${pu.mlUsados}ml = <span class="text-emerald-400 font-black">${formatarMoeda(custoEsteProd)}</span></p>
                </div>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <input type="number" value="${pu.mlUsados}" onchange="handleUpdateMlUsado(${index}, this.value)" class="w-20 bg-slate-800 border border-slate-600 rounded-xl px-2 py-1.5 text-center text-sm font-black text-white">
                <span class="text-xs text-slate-300 font-bold">ml</span>
                <button onclick="handleRemoveProdutoDoCalculo(${index})" class="p-1.5 text-slate-400 hover:text-rose-400 ml-1 font-bold text-base">✕</button>
              </div>
            </div>
          `;
        }).join('')}

        <!-- Seletor para Adicionar Produto -->
        <div class="flex gap-2 pt-1">
          <select id="select_add_produto" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-xs font-bold text-white">
            <option value="">+ Selecionar outro produto do estoque...</option>
            ${appState.produtos.map(p => `<option value="${p.id}">${p.nome} (${formatarMoeda(p.custoPorMl)}/ml)</option>`).join('')}
          </select>
          <button onclick="handleAddProdutoAoCalculo()" class="bg-sky-600 hover:bg-sky-500 text-white font-black text-xs px-4 py-3 rounded-xl shadow-lg">
            Incluir
          </button>
        </div>
      </div>

      <!-- Passo 3: Custos Adicionais Simples -->
      <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg space-y-3">
        <div class="flex items-center justify-between">
          <label class="block text-sm font-black uppercase tracking-wider text-sky-400">3. Outras Despesas (Locomoção, Hora, Máquina)</label>
          <span class="text-sm font-black text-emerald-400">Subtotal: ${formatarMoeda(custoOperacional)}</span>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-extrabold text-slate-300 mb-1">🚗 Gasolina / Locomoção (R$)</label>
            <input type="number" step="0.5" value="${calc.custoLocomocao}" onchange="handleUpdateCalcField('custoLocomocao', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white font-black">
          </div>
          <div>
            <label class="block text-xs font-extrabold text-slate-300 mb-1">🧹 Desgaste Maquinário (R$)</label>
            <input type="number" step="0.5" value="${calc.custoMaquinario}" onchange="handleUpdateCalcField('custoMaquinario', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white font-black">
          </div>
          <div>
            <label class="block text-xs font-extrabold text-slate-300 mb-1">⏱️ Tempo Estimado (Horas)</label>
            <input type="number" step="0.5" value="${calc.horasTrabalho}" onchange="handleUpdateCalcField('horasTrabalho', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white font-black">
          </div>
          <div>
            <label class="block text-xs font-extrabold text-slate-300 mb-1">💵 Valor da sua Hora (R$)</label>
            <input type="number" step="1" value="${calc.valorHora}" onchange="handleUpdateCalcField('valorHora', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white font-black">
          </div>
          <div>
            <label class="block text-xs font-extrabold text-slate-300 mb-1">🍱 Alimentação (R$)</label>
            <input type="number" step="1" value="${calc.custoAlimentacao}" onchange="handleUpdateCalcField('custoAlimentacao', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white font-black">
          </div>
          <div>
            <label class="block text-xs font-extrabold text-slate-300 mb-1">📦 Outras Despesas (R$)</label>
            <input type="number" step="1" value="${calc.custosExtras}" onchange="handleUpdateCalcField('custosExtras', this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white font-black">
          </div>
        </div>
      </div>

      <!-- CARD RESULTADO FINAL & TERMÔMETRO DE LUCRATIVIDADE -->
      <div class="bg-gradient-to-b from-slate-800 to-slate-900 p-4 rounded-2xl border-2 border-emerald-500 shadow-2xl space-y-4">
        <div class="flex items-center justify-between border-b border-slate-700 pb-3">
          <div>
            <span class="text-xs font-bold text-slate-400 uppercase">Custo Total Exato</span>
            <p class="text-3xl font-black text-rose-400">${formatarMoeda(custoTotal)}</p>
          </div>
          <div class="text-right">
            <span class="text-xs font-bold text-slate-400 uppercase">Químicos + Operacional</span>
            <p class="text-sm text-slate-200 font-bold">${formatarMoeda(custoQuimicos)} + ${formatarMoeda(custoOperacional)}</p>
          </div>

        <div>
          <label class="block text-sm font-extrabold text-slate-200 mb-2">Sugestão de Preço (Margem de Lucro):</label>
          <div class="grid grid-cols-4 gap-2">
            ${[50, 100, 150, 200].map(m => `
              <button onclick="handleSelectMargem(${m})" class="py-3 rounded-xl border text-sm font-black transition ${calc.margemSelecionada === m && calc.precoCobradoPersonalizado === null ? 'bg-emerald-500 text-slate-950 border-emerald-400 shadow-lg shadow-emerald-500/20' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-700'}">

function handleSelectTipoServico(tipo) {
  appState.calculoAtivo.itemServico = tipo;
  saveState();
  renderApp();
}

function handleAddProdutoAoCalculo() {
  const select = document.getElementById('select_add_produto');
  const id = select.value;
  if (!id) return;

  const existente = appState.calculoAtivo.produtosUsados.find(pu => pu.produtoId === id);
  if (!existente) {
    appState.calculoAtivo.produtosUsados.push({ produtoId: id, mlUsados: 100 });
    saveState();
    renderApp();
  }
}

function handleUpdateMlUsado(index, val) {
  const num = parseFloat(val) || 0;
  appState.calculoAtivo.produtosUsados[index].mlUsados = num;
  saveState();
  renderApp();
}

function handleRemoveProdutoDoCalculo(index) {
  appState.calculoAtivo.produtosUsados.splice(index, 1);
  saveState();
  renderApp();
}

function handleUpdateCalcField(field, val) {
  appState.calculoAtivo[field] = parseFloat(val) || 0;
  saveState();
  renderApp();
}

function handleSelectMargem(margem) {
  appState.calculoAtivo.margemSelecionada = margem;
  appState.calculoAtivo.precoCobradoPersonalizado = null;
  saveState();
  renderApp();
}

function handleSetPrecoPersonalizado(val) {
  if (val === '' || val === null) {
    appState.calculoAtivo.precoCobradoPersonalizado = null;
  } else {
    appState.calculoAtivo.precoCobradoPersonalizado = parseFloat(val) || 0;
  }
  saveState();

let tempFotoBase64 = '';

function previewFotoOrcamento(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(evt) {
    tempFotoBase64 = evt.target.result;
    const container = document.getElementById('foto_preview_container');
    const img = document.getElementById('foto_preview_img');
    img.src = tempFotoBase64;
    container.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

function handleSalvarOrcamento(e) {
  e.preventDefault();
  const clienteNome = document.getElementById('o_cliente').value.trim();
  const clienteTelefone = document.getElementById('o_telefone').value.trim();
  const clienteEndereco = document.getElementById('o_endereco').value.trim();
  const itemTipo = document.getElementById('o_item').value;
  const tecido = document.getElementById('o_tecido').value;
  const metragem = document.getElementById('o_metragem').value.trim();
  const valorOrcamento = parseFloat(document.getElementById('o_valor').value);

  if (!clienteNome || !clienteTelefone || isNaN(valorOrcamento)) return;

  const novoOrc = {
    id: 'o_' + Date.now(),
    clienteNome,
    clienteTelefone,
    clienteEndereco,
    itemTipo,
    tecido,
    metragem,
    fotoUrl: tempFotoBase64 || '',
    valorOrcamento,
    dataCriacao: new Date().toISOString()
  };

  appState.orcamentos.unshift(novoOrc);
  saveState();
  window.novoOrcamentoPreenchido = {};
  tempFotoBase64 = '';
  renderApp();
}

function handleEnviarWhatsApp(id) {
  const orc = appState.orcamentos.find(o => o.id === id);
  if (!orc) return;

  const foneLimpo = orc.clienteTelefone.replace(/\D/g, '');
  const empresaNome = appState.usuario ? appState.usuario.nome : 'Empresa de Higienização';
  const texto = `Olá *${orc.clienteNome}*! 🧼✨

Aqui é da *${empresaNome}*! Segue a sua cotação de higienização profissional:

🛋️ *Serviço:* ${orc.itemTipo}
🧵 *Tecido:* ${orc.tecido || 'Padrão'}
${orc.metragem ? '📐 *Medida/Obs:* ' + orc.metragem + '\n' : ''}
💰 *Valor Total:* ${formatarMoeda(orc.valorOrcamento)}

Incluso: Extração de sujeira profunda, ácaros, bactérias e odorização profissional.

Podemos agendar a melhor data para você? Aguardo seu retorno!`;

  const url = `https://wa.me/55${foneLimpo}?text=${encodeURIComponent(texto)}`;
  window.open(url, '_blank');
}

function handleAgendarOrcamento(id) {
  const orc = appState.orcamentos.find(o => o.id === id);
  if (!orc) return;

  const dataAmanha = new Date();
  dataAmanha.setDate(dataAmanha.getDate() + 1);
  dataAmanha.setHours(9, 0, 0, 0);

  const novoAgendamento = {
    id: 'a_' + Date.now(),
    clienteNome: orc.clienteNome,
    clienteTelefone: orc.clienteTelefone,
    clienteEndereco: orc.clienteEndereco,
    objeto: `${orc.itemTipo} (${orc.tecido})`,
    valor: orc.valorOrcamento,
    dataHora: dataAmanha.toISOString().slice(0, 16),
    status: 'Agendado'
  };

  appState.agenda.unshift(novoAgendamento);
  saveState();
  alert('Serviço adicionado à sua Agenda com sucesso!');
  switchTab('agenda');
}

function handleSalvarAgendamento(e) {
  e.preventDefault();
  const clienteNome = document.getElementById('a_cliente').value.trim();
  const clienteTelefone = document.getElementById('a_telefone').value.trim();
  const dataHora = document.getElementById('a_datahora').value;
  const objeto = document.getElementById('a_objeto').value.trim();
  const valor = parseFloat(document.getElementById('a_valor').value);
  const clienteEndereco = document.getElementById('a_endereco').value.trim();

  if (!clienteNome || !dataHora || isNaN(valor)) return;

  const novo = {
    id: 'a_' + Date.now(),
    clienteNome,
    clienteTelefone,
    dataHora,
    objeto,
    valor,
    clienteEndereco,
    status: 'Agendado'
  };

  appState.agenda.unshift(novo);
  saveState();
  renderApp();
}

function handleAbrirWaze(endereco) {
  if (!endereco) {
    alert('Nenhum endereço cadastrado para este serviço.');
    return;
  }
  const url = `https://maps.google.com/?q=${encodeURIComponent(endereco)}`;
  window.open(url, '_blank');
}

function handleChamarCliente(telefone) {
  const limpo = telefone.replace(/\D/g, '');
  window.open(`https://wa.me/55${limpo}`, '_blank');
}

function handleAlternarStatusAgenda(id) {
  const item = appState.agenda.find(a => a.id === id);
  if (!item) return;

  if (item.status === 'Agendado') item.status = 'Concluído';
  else if (item.status === 'Concluído') item.status = 'Cancelado';
  else item.status = 'Agendado';

  saveState();
  renderApp();
}

          </div>
          <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-700">
            <p class="font-extrabold text-white mb-1">2. Fotos Antes & Depois</p>
            <p class="font-medium">Tire foto da metade do sofá limpa e a outra metade suja durante a extração. Essa é a imagem que mais gera vendas no Instagram e WhatsApp!</p>
          </div>
          <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-700">
            <p class="font-extrabold text-white mb-1">3. Parceria com Lojas de Móveis Usados e Lavanderias</p>
            <p class="font-medium">Deixe cartões de visita em lojas de móveis usados da sua cidade oferecendo comissão ou desconto em troca de indicações.</p>
          </div>
        </div>
      </div>

      <!-- Seção 3: Script Pronto de Vendas -->
      <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-lg space-y-3">
        <h3 class="font-black text-amber-400 text-base flex items-center gap-2">
          💬 Mensagem de Vendas Pronta para Copiar
        </h3>
        <p class="text-sm text-slate-300 font-semibold">Use para mandar para o cliente que pediu orçamento e parou de responder:</p>

        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-sm text-slate-200 leading-relaxed font-semibold relative">
          <p id="script_texto">Olá! Passando para saber se ficou com alguma dúvida sobre o orçamento da higienização do seu estofado? Tenho um horário vago nesta semana com desconto especial no pagamento à vista! Posso reservar para você?</p>
        </div>

        <button onclick="handleCopiarScript()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-3.5 px-3 rounded-2xl text-sm flex items-center justify-center gap-2 shadow-lg shadow-purple-600/30 uppercase tracking-wider">
          📋 Copiar Mensagem de Vendas
        </button>
      </div>
    </div>
  `;
}

function handleCopiarScript() {
  const texto = document.getElementById('script_texto').innerText;
  navigator.clipboard.writeText(texto).then(() => {
    alert('Mensagem copiada com sucesso! Agora é só colar no WhatsApp do cliente.');
  }).catch(() => {
    alert('Selecione e copie o texto manualmente.');
  });
}

function confirmResetApp() {
  if (confirm('Deseja redefinir os dados para o padrão de exemplo?')) {
    localStorage.removeItem(STORAGE_KEY);
    appState = { ...defaultState };
    saveState();
    renderApp();
  }
}

  </script>
